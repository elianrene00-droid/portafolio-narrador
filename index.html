<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portafolio - Narrador Audiovisual</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
    }
    button {
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background: #fff;
      color: #111;
      font-weight: 600;
    }
    video {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 8px;
      background: #000;
    }
    .acciones {
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <!-- 1. Pantalla inicial con botón "Entrar" -->
  <div id="pantalla-inicio">
    <button id="btn-entrar">Entrar</button>
  </div>

  <!-- 2. Escena previa con botón "Abrir puerta" -->
  <div id="escena-puerta" style="display: none;">
    <button id="btn-abrir-puerta">Abrir puerta</button>
    <video id="video-puerta" playsinline muted preload="none" style="display: none;">
      <source src="https://media.narradoraudiovisual.com/Audios/pruebapuerta.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- 3. Escena del proyecto con el reel en bucle -->
  <div id="escena-reel" style="display: none;">
    <video id="video-reel" loop muted playsinline preload="none">
      <source src="https://media.narradoraudiovisual.com/Audios/prueba10s.mp4" type="video/mp4" />
    </video>
    <div class="acciones">
      <button id="btn-saber-mas">Saber más del proyecto</button>
    </div>
  </div>

  <!-- Audio inicial -->
  <audio id="audio-intro" preload="none">
    <source src="https://media.narradoraudiovisual.com/Audios/Intro%20Hector%20Lavoe.m4a" type="audio/mp4" />
  </audio>

  <script>
    const pantallaInicio = document.getElementById("pantalla-inicio");
    const btnEntrar = document.getElementById("btn-entrar");

    const escenaPuerta = document.getElementById("escena-puerta");
    const btnAbrirPuerta = document.getElementById("btn-abrir-puerta");
    const videoPuerta = document.getElementById("video-puerta");

    const escenaReel = document.getElementById("escena-reel");
    const videoReel = document.getElementById("video-reel");
    const btnSaberMas = document.getElementById("btn-saber-mas");

    const audioIntro = document.getElementById("audio-intro");

    btnEntrar.addEventListener("click", () => {
      audioIntro.load();
      videoPuerta.load();
      pantallaInicio.style.display = "none";
      escenaPuerta.style.display = "block";
    });

    btnAbrirPuerta.addEventListener("click", () => {
      btnAbrirPuerta.style.display = "none";
      videoPuerta.style.display = "block";

      videoPuerta.currentTime = 0;
      videoPuerta.play().catch(() => {});

      audioIntro.currentTime = 0;
      audioIntro.play().catch(() => {});
    });

    videoPuerta.addEventListener("ended", () => {
      escenaPuerta.style.display = "none";
      escenaReel.style.display = "block";
      videoReel.load();
      videoReel.currentTime = 0;
      videoReel.play().catch(() => {});
    });

    btnSaberMas.addEventListener("click", () => {
      alert("Aquí irá la información detallada de tu proyecto.");
    });
  </script>
</body>
</html>
